[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scraper-prime"
version = "2.0.0"
description = "Audited AI-assisted extraction workflow with measured domain strategies and bounded recovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "masood1996-geo" }]
keywords = [
    "scraper",
    "ai",
    "llm",
    "web-scraping",
    "data-extraction",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "lxml>=4.9",
    "openai>=1.0,<3",
    "requests>=2.31",
    "rich>=13.0",
    "undetected-chromedriver>=3.5",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage[toml]>=7.0",
    "pip-audit>=2.9",
    "pyright>=1.1",
    "pytest>=8,<10",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[project.scripts]
ai-scraper = "ai_scraper.cli:main"
ai-scraper-prime = "ai_scraper.cli:main"

[project.urls]
Homepage = "https://github.com/masood1996-geo/ai-scraper-prime"
Repository = "https://github.com/masood1996-geo/ai-scraper-prime"
Issues = "https://github.com/masood1996-geo/ai-scraper-prime/issues"

[tool.setuptools.packages.find]
include = ["ai_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["ai_scraper"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
include = ["ai_scraper"]
exclude = ["open_webui_tool.py"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
